[project]
name = "ichatbio-inaturalist-agent"
version = "1"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "openai>=1.79.0",
    "pydantic>=2.11.4",
    "instructor>=1.8.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0a1",
    "uvicorn>=0.34.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
    "langgraph>=1.2.18",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "INFO"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
]
